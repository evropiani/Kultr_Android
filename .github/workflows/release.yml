name: Release

# Publishes a signed APK as a GitHub release. Either push a tag like v1.0.0
# (matching versionName in app/build.gradle.kts), or run this workflow from
# the Actions tab with that tag: a tag that does not exist yet is created on
# the commit the run was started from.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build from the tag if it already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "$TAG"
          fi
          echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check the tag matches the app version
        run: |
          VERSION="${TAG#v}"
          NAME=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$VERSION" != "$NAME" ]; then
            echo "::error::Tag $TAG does not match versionName \"$NAME\" in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Unlock the signing key
        env:
          KULTR_SIGNING_PASSPHRASE: ${{ secrets.KULTR_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$KULTR_SIGNING_PASSPHRASE" ]; then
            echo "::error::Add the KULTR_SIGNING_PASSPHRASE secret under Settings → Secrets and variables → Actions, then run this workflow again."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/kultr-release.p12.enc -out "$RUNNER_TEMP/kultr-release.p12" \
            -pass env:KULTR_SIGNING_PASSPHRASE
          echo "KULTR_KEYSTORE_FILE=$RUNNER_TEMP/kultr-release.p12" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the release APK
        env:
          KULTR_KEYSTORE_PASSWORD: ${{ secrets.KULTR_SIGNING_PASSPHRASE }}
        run: ./gradlew --console=plain :core:test :app:assembleRelease

      - name: Verify the signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed release APK was built."
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "Kultr-$VERSION.apk"
          sha256sum "Kultr-$VERSION.apk" > "Kultr-$VERSION.apk.sha256"
          rm -f "$KULTR_KEYSTORE_FILE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then set -- --notes-file "$NOTES"; else set -- --generate-notes; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Kultr-$VERSION.apk" "Kultr-$VERSION.apk.sha256" --clobber
          else
            gh release create "$TAG" "Kultr-$VERSION.apk" "Kultr-$VERSION.apk.sha256" \
              --title "Kultr $VERSION" --target "$TARGET" "$@"
          fi

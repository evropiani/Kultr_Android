name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Signs the CI release build with a key thrown away after the run, so
      # the signing setup the release workflow relies on is tested every time.
      - name: Throwaway signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 -alias kultr \
            -keyalg RSA -keysize 2048 -validity 1 -storepass ci-only -keypass ci-only -dname "CN=Kultr CI"
          echo "KULTR_KEYSTORE_FILE=$RUNNER_TEMP/ci.p12" >> "$GITHUB_ENV"
          echo "KULTR_KEYSTORE_PASSWORD=ci-only" >> "$GITHUB_ENV"

      - name: Test, build and lint
        run: |
          set -o pipefail
          ./gradlew --console=plain --continue \
            :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug \
            2>&1 | tee build.log

      - name: Check the release APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kultr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
          if-no-files-found: ignore

      - name: Error summary
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Lint found|tests completed" build.log | grep -v "^w: " | head -200 || true
          # Lint prints only its first failure; show the whole text report.
          find app/build -name "lint-results-debug.txt" -exec cat {} \; 2>/dev/null | head -300 || true
